<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4158D0">
        <animate attributeName="stop-color" values="#4158D0;#C850C0;#FFCC70;#4158D0" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="46%" stop-color="#C850C0">
        <animate attributeName="stop-color" values="#C850C0;#FFCC70;#4158D0;#C850C0" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#FFCC70">
        <animate attributeName="stop-color" values="#FFCC70;#4158D0;#C850C0;#FFCC70" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" rx="15"/>
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="40" fill="white">
    Awesome Usage-Based Billing Platform
  </text>
  <text x="50%" y="70%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="rgba(255,255,255,0.9)">
    A curated list of top billing and metering tools
  </text>
</svg>
